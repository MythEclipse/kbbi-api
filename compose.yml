# Production deployment for the imrnes VPS.
#
# `docker compose up -d --build` is the whole deploy. The dictionary is baked
# into the image at build time (the dump is generated from the vendored dataset),
# so there is no volume to provision and no migration step — but it also means a
# dictionary refresh is a rebuild, not a restart.

services:
  kbbi-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: kbbi-api:latest
    container_name: kbbi-api
    restart: unless-stopped

    # Host 4020 → container 8080. Deliberately not 8080 on the host: GMW's
    # backend already owns that port on this VPS.
    #
    # Bound to the Tailscale IP, not 127.0.0.1. The discord-gateway that
    # consumes this API runs on a different box (orange), and Tailscale is
    # already the transport between them — Redis on this host binds
    # 100.121.180.82 the same way. Loopback-only would make the API reachable
    # from nothing but this host, which is the same as not deploying it.
    #
    # Still not 0.0.0.0: kbbi-api holds no credentials and is public data, but
    # there is no reason to add a listener on the public interface when the
    # only consumer is a Tailscale peer.
    ports:
      - "100.121.180.82:4020:8080"

    environment:
      PORT: "8080"
      KBBI_DATA_DIR: /app/kv-data

    # The dictionary is ~150MB resident once parsed into JS objects. Capping at
    # 512MB leaves headroom for the JSON parse peak without letting a leak grow
    # unbounded.
    mem_limit: 512m

    # Read-only root: the service writes nothing, so any write attempt is a bug
    # worth failing on rather than silently accommodating.
    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # Promise chain instead of `await`: `node -e` evaluates CommonJS unless
      # told otherwise, where top-level await is a syntax error. Single-quoted
      # because the expression contains ": ", which a plain YAML scalar would
      # parse as a mapping key.
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:8080/api/stats").then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))).then(s => { if (s.total_words < 100000) { console.error("dictionary incomplete: " + s.total_words); process.exit(1); } }).catch(e => { console.error(e); process.exit(1); })'
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3