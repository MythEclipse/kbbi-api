# Dependabot version updates.
#
# package.json here is managed by pnpm, but Dependabot has no `pnpm`
# ecosystem value: GitHub maps the pnpm package manager to the `npm` YAML
# value and detects pnpm-lock.yaml from it. `package-ecosystem: "pnpm"` would
# make the whole file invalid — an unknown ecosystem is rejected outright, so
# Dependabot would stop running for this repository instead of just failing to
# find a pnpm entry.
# https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories
version: 2
updates:
  # package.json + pnpm-lock.yaml at the repository root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Dependabot resolves and installs with its OWN bundled pnpm (11.x/12.x as of
    # 2026-10), ignoring this repo's `packageManager` pin. Since pnpm 11 that
    # version defaults `minimumReleaseAge` to 1440 minutes, so any dependency
    # released within the last day is refused with
    # ERR_PNPM_NO_MATURE_MATCHING_VERSION and the whole update job dies.
    # Two independent fixes, both required:
    #   1. this `cooldown` stops Dependabot proposing versions that are too young;
    #   2. `minimumReleaseAge: 0` in pnpm-workspace.yaml is read by whatever pnpm
    #      actually runs, so the install cannot fail even if a version slips past.
    cooldown:
      default-days: 3

  # actions/* references in .github/workflows/ci.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
