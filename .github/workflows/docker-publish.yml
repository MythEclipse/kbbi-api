name: Publish Docker Image to GHCR

# Triggered by the GitHub Release that .github/workflows/release.yml created,
# not by the tag push. semantic-release has already computed and recorded the
# version at that point, so this workflow reads it from
# `github.event.release.tag_name` instead of re-deriving it — one source of
# truth, and no chance of the two disagreeing about what v1.4.2 means.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v1.4.2'
        required: true
        type: string

permissions:
  contents: read
  packages: write

# FIFO across the whole repo. Every release stays in one queue: a per-tag group
# would still let an older release finish after a newer one and move `latest`
# backwards.
concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  # ghcr.io/<owner>/<repo>. Lowercased: uppercase is invalid in a registry path.
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  prepare:
    name: Resolve images and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      images: ${{ steps.resolve.outputs.images }}
      promote_latest: ${{ steps.resolve.outputs.promote_latest }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ inputs.tag == '' && github.event.release.prerelease || false }}
        run: |
          set -Eeuo pipefail
          tag="${RELEASE_TAG:-}"
          # v1.2.3 and v1.2.3-rc.1 are valid; v1.2, v1.2.3.4 and 01.2.3 are not.
          # Semantic-release emits the valid forms, so a mismatch means the tag
          # did not come from the release workflow and the Docker tag it would
          # produce is not reproducible.
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$tag' is not a Docker-safe semver tag (expected vX.Y.Z or vX.Y.Z-rc.1)"
            exit 1
          fi
          # The whole match with the leading v stripped — NOT ${BASH_REMATCH[1]}.
          # The regex groups each component so it can forbid leading zeroes, and
          # group 1 is therefore only the MAJOR version: v1.4.2 would silently
          # publish as image tag "1", which is a valid Docker tag and so fails
          # nothing until someone tries to pull v1.4.2.
          version="${BASH_REMATCH[0]#v}"
          # Docker tags allow [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}.
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::version '$version' is not a valid Docker tag"
            exit 1
          fi

          # The release's own prerelease flag is authoritative, not a string test
          # on the tag: a release can be flagged prerelease without an -rc
          # suffix. A manual republish never moves latest.
          promote_latest=false
          if [[ "$EVENT_NAME" == "release" && "$RELEASE_PRERELEASE" == "false" ]]; then
            promote_latest=true
          fi

          # Read the image list from the repo's config rather than hardcoding it
          # in the matrix, so adding a service is a one-line config change and
          # not a workflow edit. Fail loudly on an empty list: a matrix over
          # zero images reports a green run having published nothing.
          images=$(jq -c '.images | map(select(.enabled != false))' .github/docker-images.json)
          if [[ "$(jq 'length' <<<"$images")" -eq 0 ]]; then
            echo "::error::.github/docker-images.json enables no images"
            exit 1
          fi

          # Every entry needs its build context, Dockerfile and .dockerignore
          # present AND git-tracked. buildx runs from a checkout, so an untracked
          # Dockerfile here fails much later with a bare "unable to prepare
          # context", and a missing .dockerignore silently ships node_modules
          # and .git inside the image.
          while IFS= read -r img; do
            name=$(jq -r '.package' <<<"$img")
            context=$(jq -r '.context' <<<"$img")
            file=$(jq -r '.file' <<<"$img")
            [[ -n "$name" && "$name" != "null" ]] || { echo "::error::an image entry has no 'package'"; exit 1; }
            # Package name becomes a repository name in the registry path: only
            # lowercase alphanumerics and separators are allowed there.
            [[ "$name" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] \
              || { echo "::error::$name is not a valid GHCR package name (lowercase, [a-z0-9._-])"; exit 1; }
            for path in "$context/$file" "$context/.dockerignore"; do
              [[ -f "$path" ]] || { echo "::error::$name: missing $path in the checkout"; exit 1; }
              git ls-files --error-unmatch "$path" >/dev/null \
                || { echo "::error::$name: $path is not tracked by git — CI cannot see it"; exit 1; }
            done
          done < <(jq -c '.[]' <<<"$images")

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "images=${images}"
            echo "promote_latest=${promote_latest}"
          } >>"$GITHUB_OUTPUT"

          {
            echo "### Docker publish ${version}"
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            # A bash loop rather than a jq string-interpolation program: the jq
            # version needs backticks and \(...) escapes inside a single-quoted
            # program nested in a YAML `run:` block, which is precisely the
            # nesting that is hard to review and impossible to test offline.
            # The package name is validated as [a-z0-9._-] above, so it needs
            # no escaping here.
            while IFS= read -r package; do
              echo "| \`ghcr.io/${GHCR_OWNER,,}/${package}\` | \`ghcr.io/${GHCR_OWNER,,}/${package}:${version}\` |"
            done < <(jq -r '.[].package' <<<"$images")
            echo ""
            echo "- latest promotion: \`${promote_latest}\`"
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.image.package }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The default GITHUB_TOKEN is scoped to this repo's packages and is all
      # that is needed to push here. A PAT would also work and would also be a
      # credential with a much wider blast radius.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.file }}
          push: true
          platforms: ${{ matrix.image.platforms || 'linux/amd64' }}
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image.package }}:${{ needs.prepare.outputs.version }}
          # Newline-separated KEY=VALUE, which is what build-push-action parses.
          # An empty string means "no build args"; JSON would be passed through
          # literally and every ARG in the Dockerfile would resolve empty.
          build-args: ${{ matrix.image.build_args || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.title=${{ matrix.image.package }}
          cache-from: type=gha,scope=${{ matrix.image.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.package }}

      # `build-push-action` reporting success proves layers were uploaded, not
      # that the registry accepted a manifest under the tag we asked for. Read
      # the tag back and check it resolves to the digest just pushed.
      - name: Verify the published tag resolves
        env:
          IMAGE: ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image.package }}:${{ needs.prepare.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DIGEST" ]] || { echo "::error::buildx reported no digest"; exit 1; }
          echo "expecting $DIGEST"
          if ! published=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "::error::$IMAGE is not visible in the registry after push"
            exit 1
          fi
          echo "published $published"
          if [[ "$published" != "$DIGEST" ]]; then
            echo "::error::$IMAGE resolves to $published, expected $DIGEST — a concurrent push overwrote the tag"
            exit 1
          fi

  promote:
    name: Promote latest
    needs: [prepare, build]
    # Only after every image in the matrix succeeded, and only for a stable
    # release. A prerelease must never move `latest`.
    if: needs.prepare.outputs.promote_latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest onto this release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          jq -r '.[] | select(.latest != false) | .package' <<<'${{ needs.prepare.outputs.images }}' |
          while IFS= read -r package; do
            docker buildx imagetools create \
              --tag "ghcr.io/${GHCR_OWNER,,}/${package}:latest" \
              "ghcr.io/${GHCR_OWNER,,}/${package}:${VERSION}"
            echo "ghcr.io/${GHCR_OWNER,,}/${package}:latest -> ${VERSION}"
          done
