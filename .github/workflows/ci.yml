name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kbbi-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pnpm version comes from the `packageManager` field in package.json,
      # so the action and the lockfile it installs from cannot drift apart.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # pnpm must already be on PATH: `cache: pnpm` shells out to pnpm to
          # locate the store, and there is no pnpm before pnpm/action-setup.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # The 143MB upstream dataset is not committed (see .gitignore), so every
      # job that prepares a dump has to fetch it first.
      #
      # Cloned to a scratch dir and only json/ is moved into the workspace, so
      # the layout is exactly kbbi-dataset-kbbi-v-main/json/ — the same shape a
      # local dev checkout has, and what the Dockerfile COPYs. Cloning straight
      # into the workspace would nest it one level deeper under the clone's own
      # name, and a mismatch here fails as a bare ENOENT much later.
      - name: Fetch the KBBI dataset
        run: |
          tmp=$(mktemp -d)
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/baguskto/kbbi-api.git "$tmp/dataset"
          git -C "$tmp/dataset" sparse-checkout set kbbi-dataset-kbbi-v-main/json
          mkdir -p kbbi-dataset-kbbi-v-main
          mv "$tmp/dataset/kbbi-dataset-kbbi-v-main/json" kbbi-dataset-kbbi-v-main/
          rm -rf "$tmp"
          ls kbbi-dataset-kbbi-v-main/json

      # The dump is generated, not committed, so nothing in tests/ can catch a
      # dataset that no longer prepares cleanly. Build it here and assert the
      # counts, so a bad upstream refresh fails CI instead of producing an image
      # that answers "not a word" for all 112,645 words.
      - name: Prepare dictionary and verify counts
        run: |
          pnpm run prepare-data
          WORDS=$(node -e 'const fs = require("node:fs"); console.log(JSON.parse(fs.readFileSync("kv-data/__index_words__.json", "utf8")).length)')
          FORMS=$(node -e 'const fs = require("node:fs"); console.log(Object.keys(JSON.parse(fs.readFileSync("kv-data/__index_non_standard__.json", "utf8"))).length)')
          echo "dictionary: $WORDS words, $FORMS non-standard forms"
          [ "$WORDS" -gt 100000 ] || { echo "FAIL: only $WORDS words — dump is truncated"; exit 1; }
          [ "$FORMS" -gt 1000 ] || { echo "FAIL: only $FORMS non-standard forms — dump is truncated"; exit 1; }

      # Boot the real server against the prepared dump and exercise the
      # endpoints over HTTP. Unit tests use a four-word fake; this is the only
      # check that the wiring between the loader, the router and the socket
      # actually holds together on the real 112k dataset.
      - name: Smoke test the running service
        run: |
          PORT=8080 pnpm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/stats >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/stats | tee /dev/stderr | grep -q '"total_words":11[0-9][0-9][0-9][0-9]'
          curl -sf http://127.0.0.1:8080/api/lookup/keluarga | grep -q '"exists":true'
          curl -sf http://127.0.0.1:8080/api/check/ritma | grep -q '"is_standard":false'
          curl -sf http://127.0.0.1:8080/api/check/keluarga | grep -q '"is_standard":true'
          curl -sf 'http://127.0.0.1:8080/api/similar/kelakuam?limit=1' | grep -q '"word":"kelakuan"'
          # A malformed escape must 404, not kill the process: an uncaught
          # URIError in the handler takes the whole process down.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/word/kel%2)" = "404" ]
          # ...and the service must still be alive afterwards.
          curl -sf http://127.0.0.1:8080/api/stats >/dev/null

  nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false
          extra-conf: |
            sandbox = false
            accept-flake-config = true

      # No dataset clone needed here: the flake fetches it itself via
      # `pkgs.fetchFromGitHub` (pinned to a commit), so the dictionary is a
      # proper store dependency rather than something the runner supplies.
      - name: Build the Nix package
        # Runs the full typecheck + test suite inside the derivation, so a Nix
        # build failing and CI passing cannot happen.
        run: nix build .#server --impure --option sandbox false --print-build-logs

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile COPYs kbbi-dataset-kbbi-v-main/json and generates the dump
      # from it, so it must exist in the build context with exactly that shape.
      - name: Fetch the KBBI dataset
        run: |
          tmp=$(mktemp -d)
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/baguskto/kbbi-api.git "$tmp/dataset"
          git -C "$tmp/dataset" sparse-checkout set kbbi-dataset-kbbi-v-main/json
          mkdir -p kbbi-dataset-kbbi-v-main
          mv "$tmp/dataset/kbbi-dataset-kbbi-v-main/json" kbbi-dataset-kbbi-v-main/
          rm -rf "$tmp"
          ls kbbi-dataset-kbbi-v-main/json

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: kbbi-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the built image and hit it over HTTP. `docker build` succeeding only
      # proves the layers assembled; this proves the container boots, finds its
      # baked dictionary and answers correctly.
      - name: Smoke test the image
        run: |
          docker run -d --name kbbi-api-test -p 127.0.0.1:4020:8080 kbbi-api:latest
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4020/api/stats >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4020/api/stats | tee /dev/stderr | grep -q '"total_words":11[0-9][0-9][0-9][0-9]'
          curl -sf http://127.0.0.1:4020/api/word/keluarga | grep -q '"status":"success"'
          curl -sf http://127.0.0.1:4020/api/check/ritma | grep -q '"standard_form":"ritme"'
          docker rm -f kbbi-api-test

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    # Skipped until the deploy secrets exist, so a fresh clone gets a green
    # pipeline for the parts that are set up instead of a red X on SSH config
    # nobody has filled in yet. Remove this condition once VPS_HOST,
    # VPS_USER and SSH_PRIVATE_KEY are set and the first real deploy has run.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prod is the imrnes VPS, not the Orange box and not the host GMW runs on.
      # The service runs there as a container, so the deploy is a compose up
      # against a checked-out repo — no Nix store path, no profile switch.
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          # `ssh-keyscan` exits 0 even when it reaches nothing, so it is not a
          # reachability test — an unreachable host silently produced an empty
          # known_hosts and the step died later, at an unrelated command, with a
          # misleading error. Probe with ssh itself and fail here with the real
          # reason.
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
               -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then
            echo "::error::cannot SSH to $VPS_USER@$VPS_HOST."
            echo "If that address is Tailscale-only (100.64.0.0/10), a"
            echo "GitHub-hosted runner has no route to it: join the tailnet with"
            echo "the OIDC action first, or set VPS_HOST to a publicly reachable"
            echo "address."
            exit 1
          fi

      # Every deploy starts from nothing. The service is a read-only dictionary
      # with no database, no Redis and no volumes, so there is no state worth
      # keeping — but a stale image, a stale checkout or a leftover container is
      # exactly what a fresh deploy is meant to eliminate. Each removal below is
      # scoped to kbbi-api's own resources by name; the 22 other containers on
      # the host are never touched.
      - name: Reset previous state on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'set -e
            echo "=== containers ==="
            # Only this service'"'"'s container, by its own name.
            docker rm -f kbbi-api 2>/dev/null || echo "no running container"

            echo "=== images ==="
            # Remove every kbbi-api image, including dangling ones from previous
            # builds, so the next build cannot reuse a layer from an old commit.
            docker images --filter "reference=kbbi-api*" --format "{{.ID}}" \
              | xargs -r docker rmi -f

            echo "=== build cache ==="
            # Builder cache only. Deliberately NOT `docker system prune -a`:
            # that would evict the other 22 containers'"'"' images and caches.
            docker builder prune -af

            echo "=== checkout ==="
            # Full replace rather than `git fetch` + `git checkout`, so a file
            # deleted in the new commit cannot survive in the working tree.
            cd /opt/kbbi-api
            git fetch --all --tags --prune
            git checkout --force '"$(git rev-parse HEAD)"'
            git clean -fdx -e kbbi-dataset-kbbi-v-main
            echo "HEAD=$(git rev-parse --short HEAD)"
          '

      - name: Deploy to imrnes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'set -e
            cd /opt/kbbi-api
            # The dataset is fetched, not vendored. Only json/ is needed, laid out as
            # kbbi-dataset-kbbi-v-main/json to match the Dockerfile COPY and a
            # local dev checkout. Excluded from git clean above so this is not
            # re-downloaded on every deploy — it is upstream data, not build output.
            DATASET_JSON="$PWD/kbbi-dataset-kbbi-v-main/json"
            if [ ! -d "$DATASET_JSON" ]; then
              tmp=$(mktemp -d)
              git clone --filter=blob:none --sparse --depth 1 \
                https://github.com/baguskto/kbbi-api.git "$tmp/dataset"
              git -C "$tmp/dataset" sparse-checkout set kbbi-dataset-kbbi-v-main/json
              mkdir -p kbbi-dataset-kbbi-v-main
              mv "$tmp/dataset/kbbi-dataset-kbbi-v-main/json" kbbi-dataset-kbbi-v-main/
              rm -rf "$tmp"
            fi
            ls "$DATASET_JSON"

            # --no-cache: the builder cache was already cleared above, so this
            # is belt-and-braces. Without it a cached prepare-data layer could
            # carry a dictionary generated from an older dataset.
            docker compose build --no-cache
            # Recreate rather than reuse: compose only recreates a container when
            # its config or image changed, and a same-named container left over
            # from a previous run must not be adopted.
            docker compose up -d --force-recreate
            docker compose ps
          '

      - name: Verify the deployed service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Poll rather than sleep: the container needs ~40s to load 74MB of
          # JSON, and a blind sleep would either waste time or race the boot.
          ssh "$VPS_USER@$VPS_HOST" '
            for i in $(seq 1 45); do
              if curl -sf http://127.0.0.1:4020/api/stats >/dev/null 2>&1; then break; fi
              sleep 2
            done
            echo "--- stats ---"
            curl -sf http://127.0.0.1:4020/api/stats
            echo
            curl -sf http://127.0.0.1:4020/api/check/ritma
            echo
            curl -sf http://127.0.0.1:4020/api/lookup/keluarga
            echo
            docker compose -f /opt/kbbi-api/compose.yml ps
          '

          # Freshness, not just liveness. `curl /api/stats` passing only proves
          # *a* container is answering — a stale one left from a previous deploy
          # would answer it just as well, which is exactly what the wipe above is
          # supposed to prevent. Assert the running container is the one just
          # built: created after the deploy started, and running the image that
          # exists only once.
          ssh "$VPS_USER@$VPS_HOST" "
            container_id=\$(docker inspect -f '{{.Id}}' kbbi-api)
            echo \"container: \$container_id\"
            echo \"image:     \$(docker inspect -f '{{.Image}}' kbbi-api)\"
            # Started after the wipe ran, so it cannot be a leftover container.
            started=\$(docker inspect -f '{{.State.StartedAt}}' kbbi-api)
            echo \"started:   \$started\"
            # Single running instance: compose must not have left a second one.
            count=\$(docker ps --filter name=^/kbbi-api\$ --format '{{.ID}}' | wc -l)
            echo \"instances: \$count\"
            [ \"\$count\" = \"1\" ] || { echo 'FAIL: expected exactly 1 running kbbi-api container'; exit 1; }
            docker logs --tail 5 kbbi-api
          "

          # The deploy is only truthful if the VPS is running this commit.
          ssh "$VPS_USER@$VPS_HOST" "
            actual=\$(git -C /opt/kbbi-api rev-parse HEAD)
            echo \"VPS HEAD: \$actual\"
            echo \"CI  HEAD: $COMMIT_SHA\"
            [ \"\$actual\" = \"$COMMIT_SHA\" ] || { echo 'FAIL: VPS is not on the deployed commit'; exit 1; }
          "